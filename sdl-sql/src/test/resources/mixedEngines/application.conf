# Feed mixing the Spark and the SQL engine, see MixedEnginesTest:
# Spark loads a csv file into a database table, the SQL engine creates a view on it, and Spark exports the view.

env {
  # overridden in the test with configurationValueOverwrite
  tempDir = "test"
  duckdbUrl = "jdbc:duckdb:test"
}

connections {
  default-engine {
    type = SparkClassicConnection
    master = "local"
  }
  dwh {
    type = JdbcTableConnection
    url = ${env.duckdbUrl}
    driver = org.duckdb.DuckDBDriver
    db = main
  }
}

dataObjects {
  src-customers {
    type = CsvFileDataObject
    path = ${env.tempDir}"/src"
    schema = "id int, name string, city string"
  }
  stg-customers {
    type = JdbcTableDataObject
    connectionId = dwh
    table = { name = customers }
  }
  btl-customers-bern {
    type = JdbcViewDataObject
    connectionId = dwh
    table = { name = customers_bern }
  }
  exp-customers-bern {
    type = CsvFileDataObject
    path = ${env.tempDir}"/export"
  }
}

actions {
  load-customers {
    type = CopyAction
    inputId = src-customers
    outputId = stg-customers
    metadata.feed = mixed
  }
  create-customers-bern {
    type = CopyAction
    inputId = stg-customers
    outputId = btl-customers-bern
    engineConnectionId = dwh
    transformers = [{
      type = SQLDfTransformer
      code = "select id, upper(name) as name from %{inputViewName} where city = 'Bern'"
    }]
    metadata.feed = mixed
  }
  export-customers-bern {
    type = CopyAction
    inputId = btl-customers-bern
    outputId = exp-customers-bern
    metadata.feed = mixed
  }
}
