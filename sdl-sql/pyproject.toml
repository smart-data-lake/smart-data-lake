# Python environment for the SQL engine of Smart Data Lake Builder (module sdl-sql), managed with uv (https://docs.astral.sh/uv).
#
#   cd sdl-sql
#   uv sync
#
# The SQL engine runs sqlglot inside the JVM through jep (Java Embedded Python), see
# io.smartdatalake.util.python.JepInterpreter. The Python code of the engine itself (sdlb_sql/bridge.py) is packaged
# into the jar and needs no installation, but sqlglot and jep must be installed in the Python environment used.
# jep is compiled against the local JDK on installation, so JAVA_HOME must be set when running `uv sync`.
# SDLB finds the environment through SDLB_PYTHON, and otherwise falls back to `python3` on the PATH:
#
#   export SDLB_PYTHON=$PWD/.venv/bin/python     # .venv\Scripts\python.exe on Windows
#
# Without this environment the SQL engine cannot be used, and its tests cancel themselves.
# The rest of the build needs no Python at all.

[project]
name = "sdl-sql-python"
version = "0.0.0"  # neither name nor version are published, this file only defines an environment
description = "Python environment for the SQL engine of Smart Data Lake Builder"
requires-python = ">=3.10"

dependencies = [
    "sqlglot>=30,<31",
    # Keep in sync with <jep.version> in sdl-sql/pom.xml. The Java and the native part of jep must have the same version.
    "jep==4.3.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
# there is nothing to build or install from this directory, it only defines the environment
package = false

[tool.pytest.ini_options]
testpaths = ["src/test/python"]
pythonpath = ["src/main/python"]
