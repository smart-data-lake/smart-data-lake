global {
  sparkOptions {
    "fs.gs.impl" = "com.google.cloud.hadoop.fs.gcs.GoogleHadoopFileSystem"
    "spark.hadoop.fs.AbstractFileSystem.gs.impl"="com.google.cloud.hadoop.fs.gcs.GoogleHadoopFS"
    "fs.gs.auth.service.account.enable" = "true"
  }
}

connections {
  google-playground-223717 {
    type = BigQueryTableConnection
    parentProject = "playground-223717"
    authMode {
      type = GCPCredentialsKeyAuth
      serviceAccountKeyFile = "c:/projects/playground-223717-7baadcb4cfef.json"
    }
  }
}

dataObjects {

  google_shakespeare {
    type = BigQueryTableDataObject
    project = "playground-223717"
    connectionId = google-playground-223717
    table {
      db = "sdl_playground"
      name = "test_table"
    }
  }

  csv_shakespeare {
    type = CsvFileDataObject
    path = "c:/coding/playground-223717-test-data"
    sparkRepartition { numberOfTasksPerPartition = 1, filename = gcp-testdata.csv }
  }

  google_newtable {
    type = BigQueryTableDataObject
    project = "playground-223717"
    connectionId = google-playground-223717
    writeMethod = "direct"  # or "indirect"
    table {
      db = "sdl_playground"
      name = "mynew_test_table"
    }
  }

}

actions {

  google_shakespeare {
    type = CopyAction
    inputId = google_shakespeare
    outputId = csv_shakespeare
    metadata {
      feed = google_shakespear
    }
  }

  google_newtable {
    type = CopyAction
    inputId = csv_shakespeare
    outputId = google_newtable
    metadata {
      feed = google_newtable
    }
    transformers = [{
      type = BlacklistTransformer
      columnBlacklist = [id, status, created_date, amount]  # Drop these columns
    }]
  }

}

