# Python environment for the Python parts of sdl-spark, managed with uv (https://docs.astral.sh/uv).
#
#   cd sdl-spark
#   uv sync
#
# SDLB starts the Python interpreter itself, see io.smartdatalake.util.spark.PythonUtil, which goes through Spark's
# PythonRunner: it takes the interpreter from PYSPARK_DRIVER_PYTHON or PYSPARK_PYTHON and otherwise falls back to
# `python3` on the PATH. So either activate the environment before running SDLB or a test using Python:
#
#   source .venv/bin/activate       # .venv\Scripts\activate on Windows
#
# or point SDLB at it explicitly, which also works from an IDE run configuration:
#
#   export PYSPARK_PYTHON=$PWD/.venv/bin/python
#
# Without this environment the Python transformers and the MLflow Actions fail, and MLflowEndToEndTest and
# PythonDynamicTransformTest cancel themselves. The rest of the build needs no Python at all.

[project]
name = "sdl-spark-python"
version = "0.0.0"  # neither name nor version are published, this file only defines an environment
description = "Python environment for the Python transformations and the MLflow Actions of Smart Data Lake Builder"
requires-python = ">=3.12"  # the floor declared by pyspark and mlflow is 3.10, but Pandas 3.x needs Python >=3.12.

dependencies = [
    # Keep in sync with <spark.version> in the root pom.xml. PythonUtil connects the interpreter back to the running
    # JVM through pyspark.java_gateway, so both sides have to agree on the py4j protocol.
    # The sql extra adds pandas, pyarrow and numpy, which DataFrame.toPandas() needs.
    "pyspark[sql]==4.1.3",
    # 2.9 is the first version with registered model aliases, which the MLflow Actions use instead of model stages.
    # Stages are removed in MLflow 3. Both the MLflow 2 and the MLflow 3 way of logging a model are supported,
    # see MLflowPythonCode._sdlb_model_info.
    "mlflow>=2.9",
    # only used by MLflowEndToEndTest and by the example in docs/docs/reference/actions/mlflow.md
    "scikit-learn>=1.3",
]

[tool.uv]
# there is nothing to build or install from this directory, it only defines the environment
package = false
