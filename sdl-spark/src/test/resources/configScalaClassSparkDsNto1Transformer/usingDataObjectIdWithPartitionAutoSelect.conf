actions {
  double_rating {
    type = CustomDataFrameAction
    inputIds = [src1Ds, src2Ds]
    outputIds = [tgt1Ds]
    metadata.feed = test_feed_name
    transformers = [
      {type = ScalaClassSparkDsNTo1Transformer, className = io.smartdatalake.workflow.action.spark.TestResolutionByIdDs2To1Transformer, addPartitionValuesToOutput = true}
    ]
  }
}
dataObjects {
  src1Ds {
    type = io.smartdatalake.testutils.MockSparkDataObject
    partitions = [year, month, day]
  }
  src2Ds {
    type = io.smartdatalake.testutils.MockSparkDataObject
    partitions = [year, month, day]
  }
  tgt1Ds {
    type = io.smartdatalake.testutils.MockSparkDataObject
    partitions = [year, month, day]
  }
}