env {
  tempDir = "test" // override in test using configurationValueOverride parameter
}

agents {
  jetty-agent1 {
    type = JettyAgent
    url = "ws://localhost:4441/ws/"
  }
  storage-agent1 {
    type = StorageAgent
    path = ${env.tempDir}"/storage-agent1"
  }
}
// In this config, the names are described from a cloud perspective: SDLB Main Instance lives in the cloud
// and SDLB remote Agent lives "on premise", which is called remote in this config.

connections {
  agent-src {
    type = HadoopFileConnection
    pathPrefix = "dummy" // not used directly, it is redefined on the agent-remote-server configuration
  }
  cloud-staging {
    type = HadoopFileConnection
    pathPrefix = ${env.tempDir}"/cloud_staging"
  }
}

actions {
  remote-to-cloud-jetty-agent {
    type = CopyAction
    agentId = jetty-agent1
    inputId = remote-file
    outputId = cloud-file1
    metadata.feed = test-jetty
  }
  remote-to-cloud-storage-agent {
    type = CopyAction
    agentId = storage-agent1
    inputId = remote-file
    outputId = cloud-file1
    metadata.feed = test-storage
  }
  cloud-to-cloud {
    type = CopyAction
    inputId = cloud-file1
    outputId = cloud-file2
    metadata.feed = test-main
  }
}

dataObjects {
  remote-file {
    type = CsvFileDataObject
    path = "remote_file"
    connectionId = agent-src
  }
  cloud-file1 {
    type = CsvFileDataObject
    path = "cloud_file1"
    connectionId = cloud-staging
  }
  cloud-file2 {
    type = CsvFileDataObject
    path = "cloud_file2"
    connectionId = cloud-staging
  }
}