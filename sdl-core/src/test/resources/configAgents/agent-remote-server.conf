env {
  tempDir = "test" // override in test using configurationValueOverride parameter
}

connections {
  agent-src {
    id = agent-src
    type = HadoopFileConnection
    pathPrefix = ${env.tempDir}"/agent_src"
  }
  cloud-staging {
    type = HadoopFileConnection
    pathPrefix = ${env.tempDir}"/cloud_staging"
  }
}