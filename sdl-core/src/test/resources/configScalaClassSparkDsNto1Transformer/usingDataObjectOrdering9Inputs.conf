actions {
  double_rating {
    type = CustomDataFrameAction
    inputIds = [src1, src2, src3, src4, src5, src6, src7, src8, src9] //Ordering in inputIds list has to match order of parameters in transform method, but the parameter names can be named freely with this option
    outputIds = [tgt1]
    metadata.feed = test_feed_name
    transformers = [{
      type = ScalaClassSparkDsNTo1Transformer
      className = io.smartdatalake.workflow.action.spark.Ds9To1Transformer
      parameterResolution = DataObjectOrdering
    }]
  }
}

dataObjects {
  src1 {
    type = io.smartdatalake.testutils.MockSparkDataObject
    partitions = [name]
    schemaMin = """name string, rating int"""
