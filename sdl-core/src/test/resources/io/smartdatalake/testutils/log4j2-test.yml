Configuration:
  name: SDLB

  appenders:
    Console:
      name: STDOUT
      target: SYSTEM_OUT
      PatternLayout:
        Pattern: "%d{yyyy-MM-dd HH:mm:ss} %-5p %c{1} - %m [%t]%n"

  Loggers:

    # default is WARN
    Root:
      level: WARN
      AppenderRef:
        - ref: STDOUT

    logger:

      # INFO:
      - name: io.smartdatalake
        level: INFO

      # ERROR:
      - name: org.reflections.Reflections
        level: ERROR
      - name: org.apache.hadoop.hive.conf.HiveConf
        level: ERROR
      - name: org.apache.spark.sql.catalyst.analysis.SimpleFunctionRegistry
        level: ERROR
      - name: org.apache.spark.sql.catalyst.util.package
        level: ERROR
      - name: org.apache.spark.sql.catalyst.csv.CSVHeaderChecker
        level: ERROR
      - name: org.apache.spark.sql.execution.streaming.ResolveWriteToStream
        level: ERROR
      - name: org.apache.spark.sql.execution.streaming.ProcessingTimeExecutor
        level: ERROR
      - name: org.apache.spark.executor.ProcfsMetricsGetter
        level: ERROR
      - name: org.apache.hadoop.hive.metastore.ObjectStore
        level: ERROR
      - name: org.apache.hadoop.hive.ql.session.SessionState
        level: ERROR
      - name: org.apache.hadoop.util.NativeCodeLoader
        level: ERROR
      - name: org.apache.kafka.clients.admin.AdminClientConfig
        level: ERROR
      - name: io.smartdatalake.app.BuildVersionInfo$
        level: ERROR
      # Iceberg logs a stack trace on every lookup of a namespace that is not a catalog
      - name: org.apache.iceberg.spark.Spark3Util
        level: ERROR

      # WARN:
      - name: io.smartdatalake.util.misc.MemoryUtils$
        level: WARN

      # Tests provoking failures inside Spark tasks (failing transformers, expectations) make Spark log the same
      # stack trace several times with hundreds of lines. ScalaTest reports the exception anyway if a test fails.
      - name: org.apache.spark.scheduler.TaskSetManager
        level: ERROR
      - name: org.apache.spark.util.Utils
        level: WARN
        filters:
          - RegexFilter:
              regex: "Aborting task.*"
              onMatch: DENY
              onMismatch: NEUTRAL
      - name: org.apache.spark.executor.Executor
        level: WARN
        filters:
          - RegexFilter:
              regex: "Exception in task .*"
              onMatch: DENY
              onMismatch: NEUTRAL

      # Filter specific message
      - name: org.apache.spark.sql.execution.datasources.FileFormatWriter
        level: WARN
        additivity: false
        filters:
          # Ignore log events with 'AssertNotEmptyFailure' exception
          - RegexFilter:
              regex: ".*io.smartdatalake.util.spark.AssertNotEmptyFailure.*"
              onMatch: DENY
              onMismatch: NEUTRAL