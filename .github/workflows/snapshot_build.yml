name: Snapshot Build

on:
  push:
    branches:
      - 'develop-spark*'
  pull_request:
    branches:
      - 'develop-spark*'
    types: [ opened, synchronize ]
  # allow for manual snapshot releases from bugfix & feature branches
  # this extracts issue number from branch name as additional attribute in the created version, e.g. <mvnVersion>-<issueNb>-SNAPSHOT
  workflow_dispatch:
    branches:
      - 'bugfix/*'
      - 'feature/*'
      - 'develop-spark*'
    inputs:
      skipBuild:
        description: 'skip build job'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    if: ${{ !inputs.skipBuild }}

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17
      - name: Cache SonarCloud packages
        uses: actions/cache@v5
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Extract Spark version from pom.xml
        id: get_spark_version
        run: |
          SPARK_VERSION=$(grep -oPm1 '(?<=<spark.version>)[^<]+' pom.xml)
          echo "Found Spark Version $SPARK_VERSION"
          echo "spark_version=$SPARK_VERSION" >> $GITHUB_OUTPUT
          echo "SPARK_VERSION=$SPARK_VERSION" >> $GITHUB_ENV
      - name: Cache Maven
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ steps.get_spark_version.outputs.spark_version }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-${{ steps.get_spark_version.outputs.spark_version }}
      - name: Cache Spark distribution
        uses: actions/cache@v5
        with:
          path: sdl-sparkconnect/spark-${{ steps.get_spark_version.outputs.spark_version }}-bin-hadoop3
          key: ${{ runner.os }}-spark-${{ steps.get_spark_version.outputs.spark_version }}-bin

      - name: Build with Maven for Scala 2.13 and Sonar Cloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        # to avoid running tests twice, phase 'compile' instead of 'test' is used, as tests are also executed by scoverage:report
        run: mvn -P test-sonar -B -ntp -Daether.dependencyCollector.impl=bf clean compile scoverage:report -f pom.xml org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=smart-data-lake_smart-data-lake  -pl '!sdl-debezium/debezium-connector-mysql-shaded,!sdl-debezium/debezium-connector-mariadb-shaded,!sdl-kafka/embedded-kafka-schema-registry-shaded'

  deploy:
    needs: build
    if: ${{ !cancelled() && (inputs.skipBuild || (needs.build.result == 'success' && startsWith(github.ref_name, 'develop'))) }}

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # PAT token needed to trigger documentation deploy workflow (GITHUB_TOKEN wont trigger other workflows to avoid loops)
          token: ${{ secrets.PAT_ACTIONS }}          
      - name: Git Config
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"          
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Extract Spark version from pom.xml
        id: get_spark_version
        run: |
          SPARK_VERSION=$(grep -oPm1 '(?<=<spark.version>)[^<]+' pom.xml)
          echo "Found Spark Version $SPARK_VERSION"
          echo "spark_version=$SPARK_VERSION" >> $GITHUB_OUTPUT
      - name: Cache Maven
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ steps.get_spark_version.outputs.spark_version }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-${{ steps.get_spark_version.outputs.spark_version }}

      - name: Update version for SNAPSHOT releases from feature/bugfix branches with issue number from branch name
        if: ${{ startsWith(github.ref_name, 'feature') || startsWith(github.ref_name, 'bugfix')}}
        run: |
          MVN_CURRENT_VERSION=$(mvn -B -f pom.xml -q -Dexec.executable="echo" -Dexec.args='${project.version}' --non-recursive exec:exec)
          BRANCH_ISSUE_NB_STR=$(echo $GITHUB_REF_NAME | sed -n 's/^.*\(feature\|bugfix\)\/\([0-9]*\).*$/-\2/p')
          MVN_NEW_VERSION=$(echo $MVN_CURRENT_VERSION | sed -n "s/-SNAPSHOT$/${BRANCH_ISSUE_NB_STR}-SNAPSHOT/p")
          if [ -z "$MVN_NEW_VERSION" ]; then exit -1; fi
          echo "setting version to $MVN_NEW_VERSION"
          mvn versions:set -B -DnewVersion=${MVN_NEW_VERSION} -f pom.xml

      - name: Maven deploy to sonatype for Scala 2.13
        # scaladoc is skipped for snapshots: nobody consumes it, and the javadoc jars dominate the upload to sonatype central
        timeout-minutes: 60
        run: mvn -P release-sonatype -B -ntp -Daether.dependencyCollector.impl=bf -Dmaven.scaladoc.skip=true -f pom.xml clean deploy -DskipTests -pl '!sdl-debezium/debezium-connector-mysql-shaded,!sdl-debezium/debezium-connector-mariadb-shaded,!sdl-kafka/embedded-kafka-schema-registry-shaded'
        env:
          MAVEN_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Maven Get Version
        run: echo MVN_CURRENT_VERSION=$(mvn -B -f pom.xml -q -Dexec.executable="echo" -Dexec.args='${project.version}' --non-recursive exec:exec) >> $GITHUB_ENV

      - name: Push new sdl-schema.json to documentation branch
        if: ${{ contains(github.base_ref, 'develop-spark') || contains(github.ref, 'develop-spark')}}
        run: |
          git fetch origin documentation
          git checkout documentation
          # note that sdl-schema.json should be available in the location below from the previous maven build.
          mv sdl-lang/target/classes/sdl-schema.json static/json-schema-viewer/schemas/sdl-schema-${MVN_CURRENT_VERSION}.json
          git add static/json-schema-viewer/schemas/sdl-schema-${MVN_CURRENT_VERSION}.json
          git diff-index --quiet HEAD || git commit -m "Update sdl-schema-${MVN_CURRENT_VERSION}.json" # only if there is something to commit
          git push
