name: Test documentation deployment

# Validates that the documentation site still builds, without publishing it.
# Runs on pull requests that touch docs/, so a doc change is verified in the
# same PR as the code change it documents.
on:
  pull_request:
    branches: [develop-spark4, master-spark4]
    paths:
      - 'docs/**'
      - '.github/workflows/test-deploy-docs.yml'

defaults:
  run:
    # see deploy-docs.yml: create-schema-index.js is working-directory dependent
    working-directory: docs

jobs:
  test-deploy:
    name: Test deployment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test build
        run: |
          # see deploy-docs.yml: --ignore-scripts blocks dependency lifecycle
          # scripts from executing in CI (Sonar S6505)
          yarn install --frozen-lockfile --ignore-scripts
          yarn build
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
