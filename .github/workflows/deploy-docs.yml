name: Deploy documentation to GitHub Pages

# The documentation site lives in sdl-docs/ and is developed on develop-spark4.
# It is published only from master-spark4, so that the public site always reflects
# the released state and no two branches race to write the same gh-pages root.
on:
  push:
    branches: [master-spark4]
    paths:
      - 'sdl-docs/**'
      - '.github/workflows/deploy-docs.yml'

  # allow for manual releases of the documentation
  workflow_dispatch:

# Two concurrent runs would both force-push the gh-pages branch. Serialize them
# and let the newer run win rather than cancelling mid-publish.
concurrency:
  group: deploy-docs
  cancel-in-progress: false

defaults:
  run:
    # create-schema-index.js resolves static/json-schema-viewer/schemas/ relative
    # to the working directory, so the build has to run inside sdl-docs.
    working-directory: sdl-docs

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build website
        run: |
          yarn install --frozen-lockfile
          yarn build
        env:
          # required by sdl-docs/.npmrc to read @smart-data-lake/sdlb-schema-viewer
          # from the GitHub package registry
          TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Popular action to deploy to GitHub Pages:
      # Docs: https://github.com/peaceiris/actions-gh-pages#%EF%B8%8F-docusaurus
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Build output to publish to the `gh-pages` branch.
          # NOTE: defaults.run.working-directory does not apply to `uses:` steps,
          # so this path is relative to the workspace root and must include sdl-docs.
          publish_dir: ./sdl-docs/build
          # Assign commit authorship to the official GH-Actions bot for deploys to `gh-pages` branch:
          # https://github.com/actions/checkout/issues/13#issuecomment-724415212
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
