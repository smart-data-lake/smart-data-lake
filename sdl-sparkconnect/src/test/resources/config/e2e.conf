connections {
  "default-engine" {
    type = SparkConnectConnection
    url = "sc://localhost:15002"
    url = ${?SPARK_CONNECT_URL}
  }
}

dataObjects {
  srcTable {
    type = SparkConnectTableDataObject
    connectionId = "default-engine"
    table = {
      db = default
      name = sdlb_e2e_src
    }
  }
  tgtTable {
    type = SparkConnectTableDataObject
    connectionId = "default-engine"
    table = {
      db = default
      name = sdlb_e2e_tgt
    }
  }
}

actions {
  copyE2e {
    type = CopyAction
    inputId = srcTable
    outputId = tgtTable
    metadata {
      feed = e2e
    }
  }
}
