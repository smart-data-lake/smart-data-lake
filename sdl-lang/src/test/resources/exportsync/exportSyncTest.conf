# DataObjects are only used for their ids by ExportSync, they are not instantiated.
global {
  uiBackend {
    baseUrl = "http://localhost:8080/api/v1"
    repo = test
  }
}

dataObjects {
  do1 {
    type = CsvFileDataObject
    path = "target/exportsync/do1"
  }
  do2 {
    type = CsvFileDataObject
    path = "target/exportsync/do2"
  }
  other3 {
    type = CsvFileDataObject
    path = "target/exportsync/other3"
  }
}
